; CraftMaster configuration for the Fontmatrix Windows build.
;
; Modelled on KDE's own CI configuration, sysadmin/craft-ci's
; qt6/CraftConfig.ini, which is what every KDE Windows application (Kate,
; Okular, Filelight, …) is built with.
;
; Using CraftMaster rather than setup/CraftBootstrap.py is deliberate. The
; bootstrap runs `craft craft` itself, as part of installing Craft, before
; anything external can influence its settings — and that first run is what
; acquires Python, OpenSSL, ICU, gettext and the rest of the base stack. If
; the build type is wrong at that moment, Craft looks in a binary-cache path
; that does not exist, finds nothing, and compiles the whole stack from
; source. That is exactly what happened in run 35273180678: 45 minutes of
; compiling, ending in the known gettext-on-MSVC link failure.
;
; CraftMaster writes etc/CraftSettings.ini from this file *before* it invokes
; craft at all, so the settings below are in force from the very first
; command. The values are declarative and reviewable instead of being a
; regex patch against upstream Python.

[General]
Branch = master
ShallowClone = True

[Variables]
; Root is where CraftMaster puts craft-clone/ and one directory per target.
; Overridable with `--variables Root=...`.
Root = C:/Craft
UseCache = True
CreateCache = False

; Settings applied to every target. Format is Section/Key = Value, and the
; section name is case sensitive.
[GeneralSettings]
General/KFHostToolingVersion = 6
; Python has no usable default in Craft's settings template (it points at a
; Python 3.8 install that does not exist on a runner), so the workflow passes
; the interpreter's directory in as a variable.
Paths/Python = ${Variables:Python}
ShortPath/JunctionDir = C:/_
Packager/RepositoryUrl = https://files.kde.org/craft/Qt6/
Packager/UseCache = ${Variables:UseCache}
Packager/CreateCache = ${Variables:CreateCache}
; We ship no PDBs (craft-blueprints/fontmatrix/blacklist.txt drops them), so
; the separate debug-symbol archive would only be dead weight that the
; artifact collection step has to filter back out.
Packager/PackageDebugSymbols = False
ContinuousIntegration/Enabled = True
ContinuousIntegration/OutputOnFailure = True
; No code-signing certificate in this repository's CI.
CodeSigning/Enabled = False

[BlueprintSettings]
libs/qt.qtMajorVersion = 6
libs/qt5.ignored = True
libs/qt6/qtdoc.ignored = True
/.buildTests = False

; Target name matches KDE's so the settings can be compared side by side.
; BuildType is the whole point of this file: KDE publishes a binary cache per
; ABI *and* build type, and for windows/cl/msvc2022/x86_64 that is a ~1.3 MB
; RelWithDebInfo manifest refreshed daily, a ~5 KB Release one, and no
; MinSizeRel at all. Craft falls back between Release and RelWithDebInfo but
; has no fallback for MinSizeRel, so anything else means building Qt and KF6
; from source.
[windows-msvc2022_64-cl]
General/ABI = windows-cl-msvc2022-x86_64
Compile/BuildType = RelWithDebInfo
Tools/UseSystemCurl = False
