name: Build

on:
  push:
    branches: [ master ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          if echo "${{ github.ref }}" | grep -qE '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then
            VER="${{ github.ref_name }}"
            VER="${VER#v}"
            MAJOR=$(echo $VER | cut -d. -f1)
            MINOR=$(echo $VER | cut -d. -f2)
            PATCH=$(echo $VER | cut -d. -f3)
            echo "version=$VER"         >> "$GITHUB_OUTPUT"
            echo "is_release=true"      >> "$GITHUB_OUTPUT"
          else
            SHORT="${{ github.sha }}"
            SHORT="${SHORT:0:7}"
            MAJOR=0; MINOR=0; PATCH=0
            echo "version=git-${SHORT}" >> "$GITHUB_OUTPUT"
            echo "is_release=false"     >> "$GITHUB_OUTPUT"
          fi
          echo "major=$MAJOR"           >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR"           >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH"           >> "$GITHUB_OUTPUT"

      - name: Inject version into Flatpak manifest
        run: |
          python3 -c "
          import json
          m = json.load(open('com.github.fontmatrix.Fontmatrix.json'))
          mod = next(mod for mod in m['modules'] if mod['name'] == 'fontmatrix')
          mod['config-opts'] = [
            '-DVERSION_MAJOR=${{ steps.version.outputs.major }}',
            '-DVERSION_MINOR=${{ steps.version.outputs.minor }}',
            '-DVERSION_PATCH=${{ steps.version.outputs.patch }}',
          ]
          json.dump(m, open('com.github.fontmatrix.Fontmatrix.json', 'w'), indent=4)
          "

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: fontmatrix-${{ steps.version.outputs.version }}.flatpak
          manifest-path: com.github.fontmatrix.Fontmatrix.json
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: fontmatrix-flatpak
          path: fontmatrix-${{ steps.version.outputs.version }}.flatpak

  windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Determine version
        id: version
        shell: bash
        run: |
          if echo "${{ github.ref }}" | grep -qE '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then
            VER="${{ github.ref_name }}"
            VER="${VER#v}"
            MAJOR=$(echo $VER | cut -d. -f1)
            MINOR=$(echo $VER | cut -d. -f2)
            PATCH=$(echo $VER | cut -d. -f3)
            echo "version=$VER"         >> "$GITHUB_OUTPUT"
            echo "is_release=true"      >> "$GITHUB_OUTPUT"
            # Tag builds only: untagged builds keep CMakeLists' in-tree
            # version default (0.11.0) rather than being stamped 0.0.0.
            {
              echo "CRAFT_FONTMATRIX_VERSION_MAJOR=$MAJOR"
              echo "CRAFT_FONTMATRIX_VERSION_MINOR=$MINOR"
              echo "CRAFT_FONTMATRIX_VERSION_PATCH=$PATCH"
            } >> "$GITHUB_ENV"
          else
            SHORT="${{ github.sha }}"
            SHORT="${SHORT:0:7}"
            MAJOR=0; MINOR=0; PATCH=0
            VER="git-${SHORT}"
            echo "version=${VER}"       >> "$GITHUB_OUTPUT"
            echo "is_release=false"     >> "$GITHUB_OUTPUT"
          fi
          echo "major=$MAJOR"           >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR"           >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH"           >> "$GITHUB_OUTPUT"
          # Read by the fontmatrix blueprint's setTargets() and used as
          # the version label in the package filename.
          echo "CRAFT_FONTMATRIX_VERSION_FULL=$VER" >> "$GITHUB_ENV"

      - name: Scrub conflicting POSIX toolchains from PATH
        # MinGW make and MSYS2 make disagree on `/c/...` path handling;
        # if MinGW's make wins on PATH, autotools sub-builds (pkgconf,
        # openssl, icu, …) break.
        shell: pwsh
        run: |
          $cleaned = ($env:PATH -split ';' | Where-Object {
            $_ -and `
            $_ -notlike '*\mingw64\bin*' -and `
            $_ -notlike '*\mingw32\bin*' -and `
            $_ -notlike '*\Strawberry\*' -and `
            $_ -notlike '*\Git\bin*' -and `
            $_ -notlike '*\Git\usr\bin*' -and `
            $_ -notlike '*\Git\mingw64\bin*'
          }) -join ';'
          Write-Host "Original PATH segments: $((($env:PATH -split ';').Count))"
          Write-Host "Cleaned  PATH segments: $((($cleaned -split ';').Count))"
          "PATH=$cleaned" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Build with KDE Craft. Step ordering mirrors KDE's
      # sysadmin/craft-ci/gitlab-templates/blocks/windows-base.yml.

      - name: Restore Craft cache
        id: cache-craft
        uses: actions/cache/restore@v4
        with:
          # Exclusions need forward slashes + /** — actions/cache's
          # fnmatch-style matcher treats `\` as a literal on Windows,
          # so backslash patterns silently match nothing.
          key: craft-windows-x86_64-kate1-${{ hashFiles('craft-blueprints/**/*.py') }}
          restore-keys: |
            craft-windows-x86_64-kate1-
          path: |
            C:/CraftRoot
            !C:/CraftRoot/build/fontmatrix/**
            !C:/CraftRoot/tmp/**

      # cache-hit is only true for exact key matches, so check
      # craftenv.ps1 directly to also benefit from restore-keys hits.
      - name: Check if Craft is already bootstrapped
        id: craft-check
        shell: pwsh
        run: |
          $exists = Test-Path 'C:\CraftRoot\craft\craftenv.ps1'
          "bootstrapped=$($exists.ToString().ToLower())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Craft already bootstrapped: $exists"

      - name: Bootstrap KDE Craft
        if: steps.craft-check.outputs.bootstrapped != 'true'
        shell: pwsh
        run: |
          # Bypass install_craft.ps1: its `[switch]$Script:useDefaults`
          # doesn't bind via `powershell -File` (so --use-defaults never
          # reaches Python), and it swallows Python's exit code.
          if (Test-Path 'C:\CraftRoot') {
            Remove-Item -Recurse -Force 'C:\CraftRoot'
          }
          New-Item -ItemType Directory -Force -Path 'C:\CraftRoot' | Out-Null
          New-Item -ItemType Directory -Force -Path 'C:\CraftRoot\download' | Out-Null

          $pythonExe = Get-Command python -ErrorAction Stop |
            Select-Object -First 1 -ExpandProperty Source
          Write-Host "Using python: $pythonExe"
          & $pythonExe --version

          Invoke-WebRequest `
            -Uri 'https://raw.githubusercontent.com/KDE/craft/master/setup/CraftBootstrap.py' `
            -OutFile 'C:\CraftRoot\download\CraftBootstrap.py'

          # Force BuildType=Release: bootstrap defaults to MinSizeRel,
          # which has no populated KDE binary cache, so without this
          # patch every run rebuilds Qt+KF6 from source (1+ hour, plus
          # hits the gettext-on-MSVC blueprint bug).
          $bootstrapPath = 'C:\CraftRoot\download\CraftBootstrap.py'
          $content = Get-Content $bootstrapPath -Raw
          $replaceLines = @(
            '    boot.setSettingsValue("Compile", "BuildType", "Release")',
            '    boot.writeSettings()'
          )
          $replacement = $replaceLines -join "`n"
          $patched = $content -replace '    boot\.writeSettings\(\)', $replacement
          if ($patched -eq $content) {
            throw 'Failed to patch CraftBootstrap.py: writeSettings() call not found in expected form'
          }
          Set-Content -Path $bootstrapPath -Value $patched -NoNewline

          & $pythonExe -u $bootstrapPath `
            --prefix 'C:\CraftRoot' `
            --branch master `
            --use-defaults 2>&1 | Tee-Object -FilePath craft-install.log
          $bootstrapExit = $LASTEXITCODE

          $craftEnv = 'C:\CraftRoot\craft\craftenv.ps1'
          if ($bootstrapExit -ne 0 -or -not (Test-Path $craftEnv)) {
            Write-Host '::group::CraftRoot tree after failed bootstrap'
            if (Test-Path 'C:\CraftRoot') {
              Get-ChildItem -Recurse -Force 'C:\CraftRoot' |
                Select-Object FullName, Length, Mode |
                Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            } else {
              Write-Host 'C:\CraftRoot does not exist'
            }
            Write-Host '::endgroup::'
            Write-Host '::group::Last 200 lines of bootstrap log'
            Get-Content craft-install.log -Tail 200 | Out-String | Write-Host
            Write-Host '::endgroup::'
            throw "Craft bootstrap failed: exit=$bootstrapExit, craftenv.ps1 present=$(Test-Path $craftEnv)"
          }
          Write-Host "Craft bootstrap OK: $craftEnv exists"

          # NSIS lives in the cached CraftRoot so it's only installed
          # on cold cache. Clear-Host shim works around craftenv.ps1's
          # `cls` throwing on a missing console handle in pwsh.
          function Clear-Host { }
          . $craftEnv
          craft --update nsis

      - name: Upload bootstrap log on failure
        if: failure() && steps.craft-check.outputs.bootstrapped != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: craft-install-log
          path: craft-install.log
          if-no-files-found: ignore

      - name: Install Fontmatrix blueprints
        shell: pwsh
        run: |
          # Blueprint location pattern:
          #   <CraftRoot>/etc/blueprints/locations/<repo>/<category>/<name>/<name>.py
          $blueprintRoot = 'C:\CraftRoot\etc\blueprints\locations\fontmatrix'
          New-Item -ItemType Directory -Force -Path $blueprintRoot | Out-Null
          Copy-Item -Recurse -Force craft-blueprints\* $blueprintRoot\
          Get-ChildItem -Recurse $blueprintRoot -Filter '*.py' |
            ForEach-Object { Write-Host "  installed: $($_.FullName)" }

      - name: Install Fontmatrix runtime deps
        shell: pwsh
        run: |
          function Clear-Host { }
          . C:\CraftRoot\craft\craftenv.ps1
          craft --install-deps --options "[CodeSigning]Enabled=False" fontmatrix

      - name: Build Fontmatrix from source
        shell: pwsh
        run: |
          function Clear-Host { }
          # craftenv.ps1 ends with `cr` which `cd`s to $env:CraftRoot/..,
          # so capture the checkout root before sourcing.
          $srcDir = $env:GITHUB_WORKSPACE
          . C:\CraftRoot\craft\craftenv.ps1
          craft --no-cache --ignoreInstalled `
                --options "[CodeSigning]Enabled=False" `
                --options "fontmatrix.srcDir=$srcDir" `
                fontmatrix

      - name: Clean Craft tmp before packaging
        shell: pwsh
        run: |
          # Guards against any stray `fontmatrix-*` files in tmp/
          # being picked up by the Collect step's recursive glob.
          if (Test-Path 'C:\CraftRoot\tmp') {
            Remove-Item -Recurse -Force 'C:\CraftRoot\tmp\*' -ErrorAction SilentlyContinue
          }

      - name: Package Fontmatrix (NSIS installer + 7z)
        shell: pwsh
        run: |
          function Clear-Host { }
          $srcDir = $env:GITHUB_WORKSPACE
          . C:\CraftRoot\craft\craftenv.ps1
          craft --package `
                --options "[CodeSigning]Enabled=False" `
                --options "fontmatrix.srcDir=$srcDir" `
                fontmatrix

      - name: Show package size & largest deployed files
        shell: pwsh
        run: |
          Write-Host "=== Package outputs in tmp/ ==="
          Get-ChildItem 'C:\CraftRoot\tmp' -File -ErrorAction SilentlyContinue |
            Sort-Object Length -Descending |
            Format-Table @{n='MB';e={[math]::Round($_.Length/1MB,1)}}, Name -AutoSize |
            Out-String -Width 200 | Write-Host
          Write-Host ""
          Write-Host "=== Top 30 largest files in deploy staging ==="
          $stage = 'C:\CraftRoot\build\fontmatrix\archive'
          if (Test-Path $stage) {
            Get-ChildItem $stage -Recurse -File -ErrorAction SilentlyContinue |
              Sort-Object Length -Descending |
              Select-Object -First 30 |
              Format-Table @{n='MB';e={[math]::Round($_.Length/1MB,1)}}, FullName -AutoSize |
              Out-String -Width 200 | Write-Host
          } else {
            Write-Host "  (no staging dir at $stage)"
          }

      - name: Collect Craft artifacts
        id: collect
        shell: pwsh
        run: |
          $outDir = 'fontmatrix-craft-out'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Get-ChildItem -Path 'C:\CraftRoot\tmp' -Recurse `
            -Include 'fontmatrix-*.exe', 'fontmatrix-*.7z', 'fontmatrix-*.sha256' `
            -ErrorAction SilentlyContinue |
            Copy-Item -Destination $outDir
          Get-ChildItem $outDir | Format-Table -AutoSize

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: fontmatrix-windows-installer
          path: |
            fontmatrix-craft-out/fontmatrix-*.exe
            fontmatrix-craft-out/fontmatrix-*.exe.sha256
          if-no-files-found: error

      - name: Upload Windows portable archive
        uses: actions/upload-artifact@v7
        with:
          name: fontmatrix-windows-portable
          path: |
            fontmatrix-craft-out/fontmatrix-*.7z
            fontmatrix-craft-out/fontmatrix-*.7z.sha256
          if-no-files-found: error

      # `if: always()` saves the bootstrapped CraftRoot even when later
      # steps fail; skip on exact-key hits since the content is unchanged.
      - name: Save Craft cache
        if: always() && steps.cache-craft.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: craft-windows-x86_64-kate1-${{ hashFiles('craft-blueprints/**/*.py') }}
          path: |
            C:/CraftRoot
            !C:/CraftRoot/build/fontmatrix/**
            !C:/CraftRoot/tmp/**

  release:
    name: Publish to Release
    needs: [ flatpak, windows ]

    if: startsWith(github.ref, 'refs/tags/v') && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Check if tag commit is on master branch
        id: check-branch
        run: |
          git fetch origin master
          if git merge-base --is-ancestor "${{ github.sha }}" origin/master; then
            echo "on_master=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_master=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag commit is not on the master branch — skipping release upload."
          fi

      - name: Download Flatpak artifact
        if: steps.check-branch.outputs.on_master == 'true'
        uses: actions/download-artifact@v7
        with:
          name: fontmatrix-flatpak
          path: release-artifacts/

      - name: Download Windows installer
        if: steps.check-branch.outputs.on_master == 'true'
        uses: actions/download-artifact@v7
        with:
          name: fontmatrix-windows-installer
          path: release-artifacts/

      - name: Download Windows portable archive
        if: steps.check-branch.outputs.on_master == 'true'
        uses: actions/download-artifact@v7
        with:
          name: fontmatrix-windows-portable
          path: release-artifacts/

      - name: Upload artifacts to GitHub Release
        if: steps.check-branch.outputs.on_master == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/fontmatrix-*.flatpak
            release-artifacts/fontmatrix-*.exe
            release-artifacts/fontmatrix-*.7z
            release-artifacts/fontmatrix-*.sha256
