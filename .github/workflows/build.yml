name: Build

on:
  push:
    branches: [ master ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          if echo "${{ github.ref }}" | grep -qE '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then
            VER="${{ github.ref_name }}"
            VER="${VER#v}"
            MAJOR=$(echo $VER | cut -d. -f1)
            MINOR=$(echo $VER | cut -d. -f2)
            PATCH=$(echo $VER | cut -d. -f3)
            echo "version=$VER"         >> "$GITHUB_OUTPUT"
            echo "is_release=true"      >> "$GITHUB_OUTPUT"
          else
            SHORT="${{ github.sha }}"
            SHORT="${SHORT:0:7}"
            MAJOR=0; MINOR=0; PATCH=0
            echo "version=git-${SHORT}" >> "$GITHUB_OUTPUT"
            echo "is_release=false"     >> "$GITHUB_OUTPUT"
          fi
          echo "major=$MAJOR"           >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR"           >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH"           >> "$GITHUB_OUTPUT"

      - name: Inject version into Flatpak manifest
        run: |
          python3 -c "
          import json
          m = json.load(open('com.github.fontmatrix.Fontmatrix.json'))
          mod = next(mod for mod in m['modules'] if mod['name'] == 'fontmatrix')
          mod['config-opts'] = [
            '-DVERSION_MAJOR=${{ steps.version.outputs.major }}',
            '-DVERSION_MINOR=${{ steps.version.outputs.minor }}',
            '-DVERSION_PATCH=${{ steps.version.outputs.patch }}',
          ]
          json.dump(m, open('com.github.fontmatrix.Fontmatrix.json', 'w'), indent=4)
          "

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: fontmatrix-${{ steps.version.outputs.version }}.flatpak
          manifest-path: com.github.fontmatrix.Fontmatrix.json
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: fontmatrix-flatpak
          path: fontmatrix-${{ steps.version.outputs.version }}.flatpak

  windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Determine version
        id: version
        shell: bash
        run: |
          if echo "${{ github.ref }}" | grep -qE '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then
            VER="${{ github.ref_name }}"
            VER="${VER#v}"
            MAJOR=$(echo $VER | cut -d. -f1)
            MINOR=$(echo $VER | cut -d. -f2)
            PATCH=$(echo $VER | cut -d. -f3)
            echo "version=$VER"         >> "$GITHUB_OUTPUT"
            echo "is_release=true"      >> "$GITHUB_OUTPUT"
          else
            SHORT="${{ github.sha }}"
            SHORT="${SHORT:0:7}"
            MAJOR=0; MINOR=0; PATCH=0
            echo "version=git-${SHORT}" >> "$GITHUB_OUTPUT"
            echo "is_release=false"     >> "$GITHUB_OUTPUT"
          fi
          echo "major=$MAJOR"           >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR"           >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH"           >> "$GITHUB_OUTPUT"

      # Build Fontmatrix on Windows using KDE Craft. Craft is the official
      # KDE tooling for cross-platform packaging and provides full KF6
      # blueprints — vcpkg's KF6 coverage is incomplete, so Craft is the
      # supported path for KF6-based applications on Windows.
      #
      # Steps:
      #   1. Cache CraftRoot (multi-GB; first run builds Qt6 + KF6 from source).
      #   2. Bootstrap Craft non-interactively into C:\CraftRoot.
      #   3. Drop our blueprint into Craft's blueprint search path.
      #   4. Build Fontmatrix from the checked-out source via --options srcDir.
      #   5. Package as MSI + ZIP and upload as artifacts.

      - name: Cache CraftRoot
        id: cache-craft
        uses: actions/cache@v4
        with:
          # Hashed on the blueprint to invalidate when our deps list changes.
          # The build artifacts inside CraftRoot/build are excluded by Craft itself.
          key: craft-windows-x86_64-${{ hashFiles('craft-blueprints/**/*.py') }}
          path: |
            C:\CraftRoot
            !C:\CraftRoot\build\fontmatrix
            !C:\CraftRoot\tmp

      - name: Bootstrap KDE Craft
        if: steps.cache-craft.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $pythonPath = (Get-Command python).Source
          Invoke-WebRequest `
            -Uri 'https://raw.githubusercontent.com/KDE/craft/master/setup/install_craft.ps1' `
            -OutFile install_craft.ps1
          powershell -File install_craft.ps1 -useDefaults -python "$pythonPath"

      - name: Install Fontmatrix blueprint
        shell: pwsh
        run: |
          $blueprintDir = 'C:\CraftRoot\etc\blueprints\locations\fontmatrix\fontmatrix'
          New-Item -ItemType Directory -Force -Path $blueprintDir | Out-Null
          Copy-Item -Force craft-blueprints\fontmatrix\fontmatrix.py $blueprintDir\

      - name: Build Fontmatrix with Craft
        shell: pwsh
        run: |
          . C:\CraftRoot\craft\craftenv.ps1
          # Forward the version triple to the in-tree CMakeLists.
          $env:CRAFT_FONTMATRIX_VERSION_MAJOR = '${{ steps.version.outputs.major }}'
          $env:CRAFT_FONTMATRIX_VERSION_MINOR = '${{ steps.version.outputs.minor }}'
          $env:CRAFT_FONTMATRIX_VERSION_PATCH = '${{ steps.version.outputs.patch }}'
          # --ignoreInstalled forces a rebuild against the local source.
          # --options fontmatrix.srcDir=<path> uses the checkout as the source
          # tree, bypassing Craft's own VCS clone.
          craft --ignoreInstalled --options fontmatrix.srcDir=$pwd fontmatrix

      - name: Package Fontmatrix (MSI + ZIP)
        shell: pwsh
        run: |
          . C:\CraftRoot\craft\craftenv.ps1
          # Craft's --package step runs the configured packager(s); on Windows
          # this produces an NSIS or MSI installer plus a 7z archive,
          # whichever is configured in the Craft settings.
          craft --options fontmatrix.srcDir=$pwd --package fontmatrix

      - name: Collect Craft artifacts
        id: collect
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $outDir = 'fontmatrix-craft-out'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          # Craft drops package output under <CraftRoot>/tmp by default.
          # Pick up any installer-shaped file produced by the packaging step.
          Get-ChildItem -Path 'C:\CraftRoot\tmp' -Recurse `
            -Include 'fontmatrix-*.exe', 'fontmatrix-*.msi', 'fontmatrix-*.7z', 'fontmatrix-*.zip' `
            -ErrorAction SilentlyContinue |
            Copy-Item -Destination $outDir
          Get-ChildItem $outDir | Format-Table -AutoSize

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fontmatrix-windows
          path: fontmatrix-craft-out/*
          if-no-files-found: error

  release:
    name: Publish to Release
    needs: [ flatpak, windows ]

    if: startsWith(github.ref, 'refs/tags/v') && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Check if tag commit is on master branch
        id: check-branch
        run: |
          git fetch origin master
          if git merge-base --is-ancestor "${{ github.sha }}" origin/master; then
            echo "on_master=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_master=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag commit is not on the master branch — skipping release upload."
          fi

      - name: Download Flatpak artifact
        if: steps.check-branch.outputs.on_master == 'true'
        uses: actions/download-artifact@v7
        with:
          name: fontmatrix-flatpak
          path: release-artifacts/

      - name: Download Windows artifacts
        if: steps.check-branch.outputs.on_master == 'true'
        uses: actions/download-artifact@v7
        with:
          name: fontmatrix-windows
          path: release-artifacts/

      - name: Upload artifacts to GitHub Release
        if: steps.check-branch.outputs.on_master == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/fontmatrix-*.flatpak
            release-artifacts/fontmatrix-*.exe
            release-artifacts/fontmatrix-*.msi
            release-artifacts/fontmatrix-*.7z
            release-artifacts/fontmatrix-*.zip
