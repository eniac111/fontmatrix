#
# Licensing of the files that cannot carry a header of their own.
# The C++ sources have SPDX tags in the file; this covers the rest.
version = 1

# Fontmatrix' own non-source files
[[annotations]]
path = [
    "src/**/*.ui", "src/**/*.rc", "src/**/*.qrc", "src/**/*.xml", "src/**/*.png", "src/**/*.svg",
    "src/**/*.ico", "src/**/*.icns", "src/**/*.txt", "src/langs/**", "src/fontmatrix*",
    "CMakeLists.txt", "**/CMakeLists.txt",     "cmake/modules/OwnIngestOSXBundleLibraries.cmake",
    "doc/**", "dodict/**", "OSX-package/**", "craft-blueprints/**", ".github/**",
    "com.github.fontmatrix.Fontmatrix.json", "com.github.fontmatrix.Fontmatrix.desktop", "fontmatrix.1",
    "doc/screenshots/**",
    "README.md", "INSTALL.md", "AUTHORS", "ChangeLog",
    ".gitignore", "src/ReadMe", "samples/CREDITS",
]
precedence = "closest"
SPDX-FileCopyrightText = "2007-2026 Pierre Marchand and the Fontmatrix contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = ["po/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2007-2026 The Fontmatrix translators"
SPDX-License-Identifier = "GPL-2.0-or-later"

# "Directly borrowed to Scribus", which is GPL-2.0-or-later
[[annotations]]
path = ["cmake/modules/FindLIBPODOFO.cmake"]
precedence = "closest"
SPDX-FileCopyrightText = ["The Scribus Team", "2008-2026 The Fontmatrix contributors"]
SPDX-License-Identifier = "GPL-2.0-or-later"

# samples/ is NOT listed on purpose: texts of other authors (Wikipedia, Schiller, Cervantes,
# Proust, Gogol, ...), see samples/CREDITS. They need their own licences, not this project's.
