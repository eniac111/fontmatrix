#
# Licensing of the files that cannot carry a header of their own.
# The C++ sources have SPDX tags in the file; this covers the rest.
version = 1

# Fontmatrix' own non-source files
[[annotations]]
path = [
    "src/**/*.ui", "src/**/*.rc", "src/**/*.qrc", "src/**/*.xml", "src/**/*.png", "src/**/*.svg",
    "src/**/*.ico", "src/**/*.icns", "src/**/*.txt", "src/langs/**", "src/fontmatrix*",
    "CMakeLists.txt", "**/CMakeLists.txt", "cmake/modules/FindICU.cmake", "cmake/modules/FindM17N.cmake",
    "cmake/modules/OwnIngestOSXBundleLibraries.cmake",
    "doc/**", "dodict/**", "OSX-package/**", "craft-blueprints/**", ".github/**",
    "com.github.fontmatrix.Fontmatrix.json", "fontmatrix.desktop", "fontmatrix.1", "screenshot.png",
    "README.md", "INSTALL.md", "AUTHORS", "ChangeLog", "TODO", "debian-ubuntu-install.txt",
    ".gitignore", "src/ReadMe", "samples/CREDITS",
]
precedence = "closest"
SPDX-FileCopyrightText = "2007-2026 Pierre Marchand and the Fontmatrix contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = ["po/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2007-2026 The Fontmatrix translators"
SPDX-License-Identifier = "GPL-2.0-or-later"

# "Directly borrowed to Scribus", which is GPL-2.0-or-later
[[annotations]]
path = ["cmake/modules/FindLIBPODOFO.cmake"]
precedence = "closest"
SPDX-FileCopyrightText = ["The Scribus Team", "2008-2026 The Fontmatrix contributors"]
SPDX-License-Identifier = "GPL-2.0-or-later"

# Embedded libhnj (libhyphen): its own tri-licence, see src/hyphenate/COPYING
[[annotations]]
path = ["src/hyphenate/hyphen.c", "src/hyphenate/hyphen.h", "src/hyphenate/hnjalloc.c", "src/hyphenate/hnjalloc.h",
        "src/hyphenate/AUTHORS", "src/hyphenate/COPYING", "src/hyphenate/COPYING.LGPL"]
precedence = "closest"
SPDX-FileCopyrightText = [
    "1998 Raph Levien",
    "2001 ALTLinux, Moscow",
    "2001 Peter Novodvorsky <nidd@cs.msu.su>",
    "2006-2008 László Németh",
]
SPDX-License-Identifier = "GPL-2.0-or-later OR LGPL-2.1-or-later OR MPL-1.1"

# samples/ is NOT listed on purpose: texts of other authors (Wikipedia, Schiller, Cervantes,
# Proust, Gogol, ...), see samples/CREDITS. They need their own licences, not this project's.
